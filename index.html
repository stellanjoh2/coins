<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Inter+Tight:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <title>Coldcoins Hero</title>
    <script type="module" crossorigin src="./assets/index-Dptzm5jx.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-hZy82NIu.css">
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div class="hero-overlay">
        <div class="hero-text">
          <h1 class="hero-title">Coldcoins in Motion</h1>
          <button class="hero-cta">Mint yours today</button>
        </div>
      </div>

      <div class="ui-panel hidden" id="ui-panel">
        <header>
          <p>Press P to toggle</p>
        </header>
        <section>
          <h3>Bloom</h3>
          <label>
            <input type="checkbox" id="bloom-enabled" checked />
            Enabled
          </label>
          <label>
            Strength
            <input type="range" id="bloom-strength" min="0" max="5" step="0.01" value="0.58" />
          </label>
          <label>
            Radius
            <input type="range" id="bloom-radius" min="0" max="2" step="0.01" value="1.33" />
          </label>
          <label>
            Threshold
            <input type="range" id="bloom-threshold" min="0" max="1" step="0.01" value="0.44" />
          </label>
        </section>
        <section>
          <h3>Chromatic Aberration</h3>
          <label>
            <input type="checkbox" id="ca-enabled" checked />
            Enabled
          </label>
          <label>
            Offset
            <input type="range" id="ca-offset" min="0" max="0.01" step="0.0001" value="0.0013" />
          </label>
        </section>
        <section>
          <h3>Depth of Field</h3>
          <label>
            <input type="checkbox" id="dof-enabled" checked />
            Enabled
          </label>
          <label>
            Focus
            <input type="range" id="dof-focus" min="0.1" max="20" step="0.1" value="8" />
          </label>
          <label>
            Aperture
            <input type="range" id="dof-aperture" min="0.00005" max="0.002" step="0.00005" value="0.00035" />
          </label>
          <label>
            Max Blur
            <input type="range" id="dof-maxblur" min="0" max="0.02" step="0.0005" value="0.008" />
          </label>
        </section>
        <section>
          <h3>Gradient</h3>
          <label>
            Inner Color
            <input type="color" id="gradient-inner" value="#ad5cff" />
          </label>
          <label>
            Outer Color
            <input type="color" id="gradient-outer" value="#150080" />
          </label>
        </section>
        <section>
          <h3>Environment</h3>
          <label>
            Reflections
            <input type="range" id="env-intensity" min="0" max="3" step="0.01" value="1.85" />
          </label>
        </section>
        <section>
          <h3>Fog</h3>
          <label>
            Strength
            <input type="range" id="fog-strength" min="0" max="1" step="0.01" value="0.65" />
          </label>
          <label>
            Distance
            <input type="range" id="fog-distance" min="8" max="80" step="1" value="32" />
          </label>
          <label>
            Color
            <input type="color" id="fog-color" value="#4c13c9" />
          </label>
        </section>
        <section>
          <h3>Coins</h3>
          <label>
            Amount
            <input type="number" id="coin-amount" min="3" max="40" step="1" value="24" />
          </label>
          <label>
            Scatter
            <input type="range" id="coin-scatter" min="3" max="16" step="0.1" value="10.3" />
          </label>
          <label>
            Rotation Speed
            <input type="range" id="coin-rotation" min="0.3" max="2.5" step="0.01" value="1.59" />
          </label>
          <label>
            Scale
            <input type="range" id="coin-scale" min="0.6" max="1.8" step="0.01" value="1.23" />
          </label>
        </section>
        <section>
          <h3>Camera</h3>
          <label>
            Shake Amplitude
            <input type="range" id="camera-shake-amp" min="0" max="0.2" step="0.001" value="0.2" />
          </label>
          <label>
            Shake Frequency
            <input type="range" id="camera-shake-freq" min="0" max="1" step="0.01" value="0.85" />
          </label>
          <label>
            Drift Focus Height
            <input type="range" id="camera-look-height" min="0" max="2" step="0.01" value="0.82" />
          </label>
        </section>
        <button id="copy-settings">Copy Settings</button>
      </div>
    </div>

  </body>
</html>
